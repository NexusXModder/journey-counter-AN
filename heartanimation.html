<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Heart Sync Visualizer & Holographic Memory</title>

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            padding: 20px; 
            -webkit-touch-callout: none;
        }
        
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 22px; align-items: center; }
        
        /* Visualizer Box */
        .visualizer-card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 1.5rem; 
            padding: 24px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            position: relative; 
        }
        .visualizer-card h3 { color: #f43f5e; margin-bottom: 4px; font-size: 1.05rem; letter-spacing: 1px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        /* Custom SVG Shimmering Heart */
        .header-shimmer-heart { width: 20px; height: 20px; animation: headerPulse 1.5s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(244,63,94,0.8)); }
        @keyframes headerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .status { font-size: 0.78rem; color: #f59e0b; margin-bottom: 14px; transition: color 0.4s ease; font-weight: 500; }
        
        canvas { width: 100%; height: 90px; background: #0d1117; border-radius: 0.75rem; display: block; border: 1px solid #30363d; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }

        /* Telemetry Row (Ping, FPS, Latency under graph) */
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 0 6px;
        }
        .tele-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .tele-item.center {
            align-items: center;
        }
        .tele-item.right {
            align-items: flex-end;
        }
        .tele-val {
            font-size: 0.88rem;
            font-weight: 700;
            color: #8b949e;
            transition: color 0.4s ease;
        }
        .tele-lbl {
            font-size: 0.6rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Biological Vital Stats Row */
        .vital-row { display: flex; gap: 12px; width: 100%; }
        .vital-box { flex: 1; background: #161b22; border: 1px solid #30363d; padding: 12px 8px; border-radius: 1rem; text-align: center; transition: border-color 0.3s ease; }
        .vital-box .val { font-size: 1.05rem; font-weight: 700; color: #8b949e; transition: color 0.4s ease; }
        .vital-box .lbl { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; margin-top: 3px; letter-spacing: 0.5px; }

        /* 3D Holographic Card */
        .holo-card-container { perspective: 1000px; width: 100%; display: flex; justify-content: center; }
        .holo-card { 
            width: 100%; 
            height: 200px; 
            background: #161b22; 
            border: 1.5px solid #f43f5e; 
            border-radius: 1.5rem; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            cursor: pointer; 
            transition: transform 0.1s ease-out, box-shadow 0.3s ease, border-color 0.3s ease; 
            box-shadow: 0 0 20px rgba(244,63,94,0.2); 
            position: relative; 
            overflow: hidden; 
            touch-action: none; 
            animation: pulseCard 2.5s infinite;
        }

        @keyframes pulseCard {
            0%, 100% { border-color: rgba(244,63,94,0.4); box-shadow: 0 0 15px rgba(244,63,94,0.15); }
            50% { border-color: rgba(244,63,94,0.95); box-shadow: 0 0 28px rgba(244,63,94,0.45); }
        }
        
        .holo-card::after { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle 180px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(244, 63, 94, 0.32), rgba(92, 207, 230, 0.15) 50%, transparent 80%); 
            opacity: var(--light-opacity, 0); 
            transition: opacity 0.2s ease; 
            pointer-events: none; 
            z-index: 1;
        }

        .holo-card h4 { font-size: 1.2rem; color: #fff; margin-bottom: 6px; font-weight: 700; z-index: 2; letter-spacing: 0.3px; }
        .holo-card p { color: #8b949e; font-size: 0.82rem; line-height: 1.4; z-index: 2; }
        .holo-badge { position: absolute; top: 14px; right: 18px; font-size: 0.68rem; background: rgba(244,63,94,0.12); color: #f43f5e; padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(244,63,94,0.3); font-weight: 600; z-index: 2; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Frequency Visualizer -->
        <div class="visualizer-card">
            <h3>
                HEART SYNC FREQUENCY 
                <svg class="header-shimmer-heart" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#headerHeartGrad)"/>
                    <defs>
                        <linearGradient id="headerHeartGrad" x1="2" y1="3" x2="22" y2="21.35" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#ff5864"/>
                            <stop offset="1" stop-color="#f43f5e"/>
                        </linearGradient>
                    </defs>
                </svg>
            </h3>
            <div class="status" id="statusText">Status: Standby • Touch card below to initialize link</div>
            <canvas id="waveCanvas"></canvas>

            <!-- Ping, FPS, Latency telemetry metrics under the graph -->
            <div class="telemetry-row">
                <div class="tele-item">
                    <div class="tele-val" id="pingVal">-- ms</div>
                    <div class="tele-lbl">Ping</div>
                </div>
                <div class="tele-item center">
                    <div class="tele-val" id="fpsVal">-- FPS</div>
                    <div class="tele-lbl">Framerate</div>
                </div>
                <div class="tele-item right">
                    <div class="tele-val" id="latencyVal">-- ms</div>
                    <div class="tele-lbl">Latency</div>
                </div>
            </div>
        </div>

        <!-- Biological Vital Stats Box -->
        <div class="vital-row">
            <div class="vital-box" id="box1">
                <div class="val" id="bpmVal">-- BPM</div>
                <div class="lbl">Heart Rate</div>
            </div>
            <div class="vital-box" id="box2">
                <div class="val" id="resVal">0.0%</div>
                <div class="lbl">Resonance</div>
            </div>
            <div class="vital-box" id="box3">
                <div class="val" id="freqVal">0 Hz</div>
                <div class="lbl">Frequency</div>
            </div>
        </div>

        <!-- 3D Holographic Card -->
        <div class="holo-card-container">
            <div class="holo-card" id="tiltCard">
                <span class="holo-badge">Quantum Entanglement</span>
                <h4>Our Special Connection</h4>
                <p id="cardInstruction">Touch and drag here to bridge Cores and activate field telemetry.</p>
            </div>
        </div>
    </div>

    <script>
        // Disable Right Click & Inspect Shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });

        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        
        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 48;
            canvas.height = 90;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        let step = 0;
        let isConnected = false;

        // Draw flat line initially before connection
        function drawInitialWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#30363d';
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }
        drawInitialWave();

        function drawActiveWave() {
            if (!isConnected) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#f43f5e';

            let sliceWidth = canvas.width / 100;
            let x = 0;

            for (let i = 0; i < 100; i++) {
                let v = Math.sin((i + step) * 0.1) * Math.cos((i - step) * 0.05);
                let y = (canvas.height / 2) + (v * (canvas.height / 3));

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                x += sliceWidth;
            }
            ctx.stroke();
            step += 0.035; 
            requestAnimationFrame(drawActiveWave);
        }

        const card = document.getElementById('tiltCard');
        const statusText = document.getElementById('statusText');
        const bpmVal = document.getElementById('bpmVal');
        const resVal = document.getElementById('resVal');
        const freqVal = document.getElementById('freqVal');
        
        // New Telemetry Elements
        const pingVal = document.getElementById('pingVal');
        const fpsVal = document.getElementById('fpsVal');
        const latencyVal = document.getElementById('latencyVal');

        const cardInstruction = document.getElementById('cardInstruction');
        const box1 = document.getElementById('box1');
        const box2 = document.getElementById('box2');
        const box3 = document.getElementById('box3');

        function triggerConnection() {
            if (isConnected) return;
            
            statusText.style.color = '#f59e0b';
            statusText.textContent = 'Status: Measuring quantum field... Linking Cores';
            cardInstruction.textContent = 'Calibrating symmetrical resonance... Hold interaction.';

            setTimeout(() => {
                isConnected = true;
                statusText.style.color = '#5ccfe6';
                statusText.textContent = 'Status: Bio-Synced • Core A Connected to Core B (Secure)';
                cardInstruction.textContent = 'Fully Synchronized. Move around to experience holographic tilt.';
                
                box1.style.borderColor = '#5ccfe6';
                box2.style.borderColor = '#5ccfe6';
                box3.style.borderColor = '#5ccfe6';

                // Activate colors for all metrics
                bpmVal.style.color = '#5ccfe6';
                resVal.style.color = '#5ccfe6';
                freqVal.style.color = '#5ccfe6';
                pingVal.style.color = '#5ccfe6';
                fpsVal.style.color = '#5ccfe6';
                latencyVal.style.color = '#5ccfe6';
                
                // Initial values
                bpmVal.textContent = '75 BPM';
                resVal.textContent = '99.9%';
                freqVal.textContent = '100 Hz';
                pingVal.textContent = '18 ms';
                fpsVal.textContent = '60 FPS';
                latencyVal.textContent = '12 ms';

                drawActiveWave();

                // Live dynamic fluctuations for all stats together
                setInterval(() => {
                    if (isConnected) {
                        const randomBpm = 72 + Math.floor(Math.random() * 6);
                        const randomPing = 16 + Math.floor(Math.random() * 7);
                        const randomFps = 59 + Math.floor(Math.random() * 3);
                        const randomLatency = 11 + Math.floor(Math.random() * 4);

                        bpmVal.textContent = randomBpm + ' BPM';
                        pingVal.textContent = randomPing + ' ms';
                        fpsVal.textContent = randomFps + ' FPS';
                        latencyVal.textContent = randomLatency + ' ms';
                    }
                }, 2500);

            }, 1800);
        }

        function handleMove(clientX, clientY) {
            triggerConnection();

            const rect = card.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -12;
            const rotateY = ((x - centerX) / centerX) * 12;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
            card.style.setProperty('--light-opacity', `1`);
        }

        card.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        card.addEventListener('mouseenter', () => card.style.setProperty('--light-opacity', `1`));
        card.addEventListener('touchmove', (e) => { if(e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        card.addEventListener('touchstart', (e) => { if(e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        
        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.setProperty('--light-opacity', `0`);
        });
        card.addEventListener('touchend', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.setProperty('--light-opacity', `0`);
        });
    </script>
</body>
</html>

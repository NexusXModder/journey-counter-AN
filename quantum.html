<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Neural Entanglement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        .entanglement-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; touch-action: none; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .node {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #f43f5e 0%, #881337 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #f43f5e, inset 0 0 10px rgba(255, 255, 255, 0.4);
            cursor: grab;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 1.2rem;
            user-select: none;
            touch-action: none;
        }

        .node:active { cursor: grabbing; }

        .node::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            border: 1px dashed rgba(244, 63, 94, 0.5);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .info-panel {
            position: absolute;
            bottom: 40px;
            text-align: center;
            z-index: 3;
            pointer-events: none;
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            padding: 14px 28px;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .info-panel h2 { font-size: 1rem; color: #fff; font-weight: 700; letter-spacing: 0.5px; }
        .info-panel p { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="entanglement-container" id="canvasContainer">
        <canvas id="entangleCanvas"></canvas>
        
        <!-- Node A -->
        <div class="node" id="node1">A</div>
        <!-- Node N (Mirrored/Entangled) -->
        <div class="node" id="node2">N</div>

        <div class="info-panel">
            <h2>QUANTUM ENTANGLEMENT FIELD</h2>
            <p>Drag Core "A" • Where one goes, the other follows</p>
            <p>Absolute connection: Core A linked to N across spacetime</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('entangleCanvas');
        const ctx = canvas.getContext('2d');
        const node1 = document.getElementById('node1');
        const node2 = document.getElementById('node2');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;

        let pos1 = { x: centerX - 120, y: centerY };
        let pos2 = { x: centerX + 120, y: centerY };

        let targetPos1 = { x: centerX - 120, y: centerY };
        let targetPos2 = { x: centerX + 120, y: centerY };

        let isDragging = false;

        function updateDOM() {
            node1.style.transform = `translate(${pos1.x - centerX}px, ${pos1.y - centerY}px)`;
            node2.style.transform = `translate(${pos2.x - centerX}px, ${pos2.y - centerY}px)`;
        }

        let particles = [];
        for(let i = 0; i < 15; i++) {
            particles.push({ progress: Math.random(), speed: 0.01 + Math.random() * 0.02 });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;

            if (isDragging) {
                pos1.x += (targetPos1.x - pos1.x) * 0.3;
                pos1.y += (targetPos1.y - pos1.y) * 0.3;
            } else {
                let time = Date.now() * 0.002;
                targetPos1.x = (centerX - 120) + Math.sin(time) * 25;
                targetPos1.y = centerY + Math.cos(time * 0.8) * 20;

                pos1.x += (targetPos1.x - pos1.x) * 0.1;
                pos1.y += (targetPos1.y - pos1.y) * 0.1;
            }

            // Symmetric Inverse Mirror Physics
            targetPos2.x = centerX + (centerX - pos1.x);
            targetPos2.y = centerY + (centerY - pos1.y);

            pos2.x += (targetPos2.x - pos2.x) * 0.3;
            pos2.y += (targetPos2.y - pos2.y) * 0.3;

            updateDOM();

            let center1X = pos1.x + 27.5;
            let center1Y = pos1.y + 27.5;
            let center2X = pos2.x + 27.5;
            let center2Y = pos2.y + 27.5;

            // Draw Energy Bridge
            ctx.beginPath();
            ctx.moveTo(center1X, center1Y);
            ctx.lineTo(center2X, center2Y);
            
            let dist = Math.hypot(center2X - center1X, center2Y - center1Y);
            let alpha = Math.min(1, Math.max(0.3, 400 / dist));
            
            ctx.strokeStyle = `rgba(244, 63, 94, ${alpha})`;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f43f5e';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Flowing Particles
            particles.forEach(p => {
                p.progress += p.speed;
                if(p.progress > 1) p.progress = 0;

                let px = center1X + (center2X - center1X) * p.progress;
                let py = center1Y + (center2Y - center1Y) * p.progress;

                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#5ccfe6';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#5ccfe6';
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Safe Drag Handlers with Screen Bounds
        function onMove(clientX, clientY) {
            if (!isDragging) return;
            
            let newX = clientX - 27.5;
            let newY = clientY - 27.5;

            // Keep within safe window boundaries
            const padding = 40;
            targetPos1.x = Math.max(padding, Math.min(window.innerWidth - padding - 55, newX));
            targetPos1.y = Math.max(padding, Math.min(window.innerHeight - padding - 55, newY));
        }

        node1.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));

        node1.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>

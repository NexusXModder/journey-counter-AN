<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>NexusXModder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0b;
      --s1: #131315;
      --s2: #1a1a1d;
      --s3: #222226;
      --line: #2a2a2f;
      --iv: #f4f4f5;
      --mute: #9a9aa3;
      --gold: #4f8cff;
      --gold2: #2f6fe0;
      --rose: #4f8cff;
      --gr: #4f8cff;
      --serif: 'Inter', system-ui, sans-serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--ink);
      color: var(--iv);
      font-family: var(--sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      max-width: 100%;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .gold {
      color: var(--iv);
    }

    body::before {
      content: "";
      position: fixed;
      top: -180px;
      left: 50%;
      width: 720px;
      height: 460px;
      max-width: 100vw;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(79, 140, 255, .3), transparent);
      pointer-events: none;
      z-index: -1;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between !important;
      padding: 10px 12px 10px 10px !important;
      background: linear-gradient(135deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .05));
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 -1px 0 rgba(255, 255, 255, .05);
      width: min(920px, 94vw) !important;
      max-width: none !important;
      gap: 0 !important;
    }

    .brand {
      font-family: var(--serif);
      font-size: 28px !important;
      font-weight: 800 !important;
      letter-spacing: .2em !important;
      text-decoration: none;
      display: inline-flex !important;
      align-items: center;
      gap: 20px !important;
      padding: 2px 12px 2px 2px !important;
      margin: 0 !important;
      color: #fff !important;
      background: 0 0 !important;
      border: 0 !important;
      box-shadow: none !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
      transition: .2s;
    }

    .brand .logo {
      width: 64px !important;
      height: 64px !important;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      border: 2px solid rgba(255, 255, 255, .85) !important;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 4px 14px rgba(0, 0, 0, .5);
      background: #1a1a1d;
    }

    .logo.ph {
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0;
      background: #26262b;
      color: #fff;
    }

    nav a.l {
      color: var(--mute);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    nav a.l:hover {
      color: var(--iv);
    }

    .btn {
      background: var(--s2);
      border: 1px solid var(--line);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      transition: .2s;
      color: var(--iv);
    }

    .btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn.pri {
      background: var(--gr);
      color: #fff;
      border: 0;
    }

    .btn.pri:hover {
      filter: brightness(1.1);
      color: #fff;
    }

    /* Saved Button */
    .save-btn {
      width: 64px !important;
      height: 64px !important;
      min-width: 64px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      display: grid !important;
      place-items: center;
      gap: 0 !important;
      border: 2px solid rgba(255, 255, 255, .85) !important;
      background: rgba(255, 255, 255, .1) !important;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 4px 14px rgba(0, 0, 0, .5) !important;
      transition: transform .15s, background .2s;
      position: relative;
    }

    .save-btn:hover {
      background: rgba(255, 255, 255, .2) !important;
      border-color: #fff !important;
    }

    .save-btn:active {
      transform: scale(.94);
    }

    .save-btn span {
      display: none !important;
    }

    .save-btn svg {
      grid-area: 1/1;
      width: 30px !important;
      height: 30px !important;
      stroke-width: 1.7;
      fill: none;
      stroke: #fff;
      stroke-linejoin: round;
      display: block !important;
    }

    .save-btn.has svg {
      fill: #fff;
    }

    .save-btn b {
      grid-area: 1/1;
      display: block !important;
      margin-top: -3px;
      padding: 0 !important;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
      color: #0a0a0b !important;
      z-index: 1;
      background: 0 0 !important;
      box-shadow: none !important;
    }

    .save-btn b[hidden] {
      display: none !important;
    }

    /* Hero */
    .hero {
      padding: 150px 5vw 0;
      max-width: 1500px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 48px;
      align-items: center;
      padding-bottom: 0;
    }

    .hero h1 {
      font-family: var(--serif);
      font-weight: 800;
      font-size: clamp(40px, 6vw, 84px);
      line-height: 1.02;
      letter-spacing: -.035em;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--gold);
    }

    .hero p.sub {
      color: var(--mute);
      max-width: 480px;
      margin: 22px 0 28px;
      font-size: 17px;
    }

    .hs {
      display: flex;
      max-width: 560px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      padding: 6px;
      -webkit-backdrop-filter: blur(16px) saturate(165%);
      backdrop-filter: blur(16px) saturate(165%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .hs input {
      flex: 1;
      background: 0 0;
      border: 0;
      padding: 12px 20px;
      outline: 0;
      min-width: 0;
    }

    .hs input::placeholder {
      color: #b4b4bd;
    }

    .hs button {
      border: 0;
      border-radius: 999px;
      padding: 0 28px;
      font-weight: 700;
      background: #4f8cff;
      color: #fff;
    }

    /* Main & Controls */
    main {
      max-width: 1500px;
      margin: auto;
      padding: 14px 5vw 60px;
    }

    .tools {
      position: sticky;
      top: 76px !important;
      z-index: 10;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px 0 !important;
      background: 0 0 !important;
    }

    .seg {
      display: flex;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      padding: 3px;
      -webkit-backdrop-filter: blur(16px) saturate(165%);
      backdrop-filter: blur(16px) saturate(165%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .seg button {
      background: 0 0;
      border: 0;
      padding: 7px 16px;
      border-radius: 999px;
      color: #c4c4cc;
      font-weight: 600;
      font-size: 14px;
    }

    .seg button.on {
      background: #4f8cff;
      color: #fff;
    }

    /* Media Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 26px 18px;
      scroll-margin-top: 150px;
    }

    .card {
      margin: 0;
      background: 0 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      cursor: pointer;
      position: relative;
      transition: border-color .2s;
    }

    .card:hover {
      background: 0 0;
      transform: none;
    }

    .card .im {
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      background: var(--s2);
      position: relative;
    }

    .card img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      display: block;
      background: var(--s2);
      transition: none !important;
    }

    .card:hover img {
      transform: none !important;
    }

    .card .pl {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0006;
    }

    .card .pl i {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0a0a0bcc;
      border: 1px solid var(--gold);
      display: grid;
      place-items: center;
      color: var(--gold);
      font-style: normal;
      padding-left: 4px;
    }

    .card .m {
      padding: 10px 2px 0;
      background: 0 0;
      border: 0;
    }

    .card h3 {
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card small {
      color: var(--mute);
      font-size: 13px;
    }

    .bd {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #0a0a0bcc;
      border: 1px solid #4f8cff66;
      color: var(--gold);
      padding: 1px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      z-index: 2;
    }

    .fv {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 0;
      background: rgba(10, 10, 14, .55);
      border: 1px solid rgba(255, 255, 255, .35);
      color: #fff;
      transition: .2s;
    }

    #mF svg,
    .fv svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linejoin: round;
    }

    .fv.on {
      background: #4f8cff;
      border-color: #fff;
      color: #fff;
    }

    #mF.on svg,
    .fv.on svg {
      fill: #fff;
    }

    #mF {
      gap: 8px;
    }

    #mF.on {
      background: #4f8cff;
      border-color: #4f8cff;
      color: #fff;
    }

    .card .aud {
      height: auto;
      aspect-ratio: 16/9;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--s2);
      color: var(--gold);
      font-family: var(--serif);
      font-size: 28px;
    }

    .skel {
      height: auto;
      aspect-ratio: 16/9;
      margin: 0;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--s1) 25%, var(--s2) 50%, var(--s1) 75%);
      background-size: 200% 100%;
      animation: sh 1.4s infinite;
    }

    @keyframes sh {
      to {
        background-position: -200% 0;
      }
    }

    .empty {
      color: var(--mute);
      text-align: center;
      padding: 60px 0;
      grid-column: 1 / -1;
    }

    #sent {
      height: 1px;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #040408f5;
      display: none;
      overflow: auto;
      padding: 22px 4vw;
    }

    .modal.open {
      display: block;
    }

    .box {
      max-width: 1240px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      gap: 20px;
    }

    .left {
      min-width: 0;
    }

    .left,
    .side {
      background: var(--s1);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
    }

    .stage {
      background: #000;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      min-height: 300px;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .stage > img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
      display: block;
    }

    .info {
      padding: 22px 26px;
    }

    .info h2 {
      font-family: var(--serif);
      font-size: 30px;
      line-height: 1.1;
      font-weight: 600;
    }

    .info .mt {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      margin: 6px 0 10px;
    }

    .info p {
      color: #c9c3d4;
      font-size: 15px;
      white-space: pre-line;
      max-height: 150px;
      overflow: auto;
    }

    .kw span {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 11px;
      margin: 10px 6px 0 0;
      font-size: 12px;
      color: var(--mute);
    }

    .side {
      padding: 24px;
      align-self: start;
      position: sticky;
      top: 0;
    }

    .side h4 {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 600;
    }

    .side .hint {
      color: var(--mute);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .dl {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--s2);
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .dl.best {
      border-color: var(--gold);
    }

    .dl .bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0;
      background: var(--gr);
    }

    .dl .n {
      flex: 1;
      min-width: 0;
    }

    .dl .n b {
      display: block;
      font-size: 15px;
    }

    .dl .n small {
      color: var(--mute);
      font-size: 12px;
    }

    .dl .tg {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--gr);
      padding: 1px 8px;
      border-radius: 999px;
      margin-left: 6px;
    }

    .dl button {
      background: var(--gr);
      border: 0;
      color: #fff;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      min-width: 92px;
    }

    .dl.on-play {
      background: var(--s3);
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .ar,
    .x {
      position: fixed;
      z-index: 70;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #000c;
      border: 1px solid var(--line);
      font-size: 20px;
      display: grid;
      place-items: center;
    }

    .x {
      top: 16px;
      right: 18px;
    }

    .ar {
      top: 50%;
    }

    .ar.l {
      left: 8px;
    }

    .ar.r {
      right: 8px;
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gr);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 700;
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
    }

    .toast.show {
      opacity: 1;
    }

    /* Player */
    .pl8 {
      position: relative;
      width: 100%;
      max-width: 100%;
      background: #000;
      aspect-ratio: 16/9;
      display: block;
      user-select: none;
    }

    .pl8.aud {
      background: #141416;
    }

    .pl8 video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .pl8 .big {
      position: absolute;
      inset: 0 0 60px;
      display: grid;
      place-items: center;
      background: 0 0;
      border: 0;
    }

    .pl8 .big i {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #0a0a0bb0;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-style: normal;
      padding-left: 6px;
      transition: .25s;
    }

    .pl8.play .big i {
      opacity: 0;
      transform: scale(1.4);
    }

    .eq {
      position: absolute;
      inset: 0 0 70px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      padding-bottom: 18%;
      pointer-events: none;
    }

    .eq b {
      width: 8px;
      height: 20%;
      border-radius: 4px;
      background: var(--gr);
      animation: eq 1s ease-in-out infinite;
      animation-play-state: paused;
    }

    .pl8.play .eq b {
      animation-play-state: running;
    }

    .eq b:nth-child(2n) {
      animation-delay: -.4s;
    }

    .eq b:nth-child(3n) {
      animation-delay: -.7s;
      height: 45%;
    }

    .eq b:nth-child(5n) {
      animation-delay: -.2s;
    }

    @keyframes eq {
      50% {
        height: 90%;
      }
    }

    .ctl {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 34px 16px 12px;
      background: linear-gradient(transparent, #000d);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: .3s;
    }

    .pl8.play.idle .ctl {
      opacity: 0;
    }

    .pl8.play.idle {
      cursor: none;
    }

    .seek {
      --h: 4px;
      position: relative;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .seek .tr {
      position: absolute;
      left: 0;
      right: 0;
      background: #ffffff30;
      transition: none;
    }

    .seek .bf,
    .seek .pg,
    .seek .tr {
      height: var(--h) !important;
      top: 50%;
      margin-top: calc(var(--h) / -2);
      border-radius: 99px;
    }

    .seek .bf {
      position: absolute;
      left: 0;
      background: #ffffff40;
    }

    .seek .pg {
      position: absolute;
      left: 0;
      background: var(--gr);
    }

    .seek .th {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      transform: translateX(-50%) scale(0);
      transition: .15s;
      top: 50%;
      margin-top: -7px;
      box-shadow: 0 0 10px #4f8cff88;
    }

    @media (hover: hover) {
      .seek:hover {
        --h: 6px;
      }
      .seek:hover .th {
        transform: translateX(-50%) scale(1);
      }
    }

    .cr {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cr button {
      background: 0 0;
      border: 0;
      color: var(--iv);
      font-size: 15px;
      min-width: 34px;
      height: 34px;
      border-radius: 8px;
      opacity: .9;
    }

    .cr button:hover {
      color: var(--gold);
      background: #ffffff14;
    }

    .cr .tm {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: #d8d2c4;
      margin: 0 8px;
      white-space: nowrap;
    }

    .cr .sp {
      flex: 1;
    }

    .vol {
      width: 70px;
      accent-color: var(--gold);
      height: 4px;
    }

    .cr .sb {
      font-size: 13px;
      font-weight: 700;
    }

    /* Media Queries */
    @media (max-width: 1000px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
        padding-top: 120px;
      }

      .box {
        grid-template-columns: minmax(0, 1fr);
      }

      .ar {
        display: none;
      }

      .side {
        position: static;
        align-self: stretch;
        width: 100%;
      }

      .vol {
        display: none;
      }
    }

    @media (min-width: 701px) and (max-width: 1000px) {
      .hero {
        padding-top: 110px;
      }

      .stage > img {
        max-height: 60vh;
      }
    }

    @media (max-width: 700px) {
      main {
        padding: 8px 14px 40px;
      }

      input,
      select {
        font-size: 16px !important;
      }

      nav {
        top: max(8px, env(safe-area-inset-top));
        padding: 6px 6px 6px 6px !important;
        gap: 0 !important;
        width: calc(100% - 20px) !important;
